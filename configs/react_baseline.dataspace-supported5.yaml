dataset:
  root_path: data/dataspace-supported5/input

agent:
  api_base: ${MODEL_API_URL:-https://api.deepseek.com/v1}
  api_key: ${DEEPSEEK_API_KEY}
  model: ${MODEL_NAME:-deepseek-chat}
  max_steps: 16
  temperature: 0.0

harness:
  mode: raw
  prompt_version: react-v1
  semantic_model_version: unversioned

run:
  output_dir: artifacts/runs
  max_workers: 1
  task_timeout_seconds: 600
